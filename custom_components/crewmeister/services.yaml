create_stamp:
  fields:
    stamp_type:
      required: true
      selector:
        select:
          translation_key: stamp_type
          options:
            - start_work
            - start_break
            - clock_out
    timestamp:
      selector:
        datetime:
    note:
      selector:
        text:
    location:
      selector:
        text:
    time_account_id:
      selector:
        number:
          min: 1
          mode: box
          step: 1
    config_entry_id:
      selector:
        config_entry:
          integration: crewmeister

show_live:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: crewmeister
